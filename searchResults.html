<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Khoros Search Results</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background: white;
            color: black;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        #summary {
            margin-bottom: 20px;
            color: #555;
        }

        details {
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 6px 10px;
        }

        summary {
            cursor: pointer;
            font-weight: bold;
        }

        .topic-author {
            color: #666;
            font-weight: normal;
        }

        .post {
            margin: 10px 0 4px 20px;
        }

            .post a {
                text-decoration: none;
            }

                .post a:hover {
                    text-decoration: underline;
                }

        .post-id {
            color: #777;
            font-size: 12px;
        }

        #no-results {
            margin-top: 20px;
            color: #777;
        }
    </style>
</head>

<body>

    <h1 id="title">Khoros Search Results</h1>
    <div id="summary"></div>
    <div id="results"></div>

    <script src="searchResults.js"></script>

</body>
</html>
